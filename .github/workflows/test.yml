name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        php-version: ['8.2', '8.3', '8.4']

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: json, curl, mbstring
        tools: composer:v2
        coverage: ${{ matrix.php-version == '8.2' && 'pcov' || 'none' }}

    - name: Get composer cache directory
      id: composer-cache
      run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

    - name: Cache composer dependencies
      uses: actions/cache@v4
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: ${{ runner.os }}-composer-

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Check for known vulnerabilities
      run: composer audit --abandoned=report

    - name: Run code style check
      run: composer cs

    - name: Run static analysis
      run: composer analyse

    - name: Run tests
      run: composer test

    - name: Generate test coverage
      if: matrix.php-version == '8.2'
      run: composer test-coverage

    - name: Upload coverage to Codecov
      if: matrix.php-version == '8.2'
      # Reporting only; a missing Codecov token must not fail the build.
      continue-on-error: true
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage/clover.xml
        flags: unittests
        name: codecov-umbrella

  docker:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Build Docker image
      run: docker build -t hue-client .

    - name: Test Docker image
      run: |
        docker run --rm hue-client php --version
        docker run --rm hue-client composer --version