services:
  hue-api:
    build: .
    ports:
      - "8080:8080"
    environment:
      - HUE_BRIDGE_IP=${HUE_BRIDGE_IP:?Set HUE_BRIDGE_IP}
      - HUE_USERNAME=${HUE_USERNAME:?Set HUE_USERNAME}
      # Clients send it as "Authorization: Bearer <key>". Generate one with: openssl rand -hex 24
      - HUE_API_KEY=${HUE_API_KEY:?Set HUE_API_KEY}
      - HUE_CORS_ORIGINS=${HUE_CORS_ORIGINS:-}
    volumes:
      - ./:/var/www
    networks:
      - hue-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # Optional cache backend (HueClient cache_type: redis). Reachable only from
  # the hue-api container: it has no password.
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    networks:
      - hue-network
    restart: unless-stopped

networks:
  hue-network:
    driver: bridge

volumes:
  redis_data:
